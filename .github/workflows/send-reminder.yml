name: Send Reminder

on:
  schedule:
    - cron: '15 10 * * 6'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > stryktipset-priors-automation-27f390beda4d.json

      - name: Write email config
        run: echo '${{ secrets.EMAIL_CONFIG }}' > email_config.txt

      - name: Run send_reminder_if_needed
        env:
          EXPERT_EMAILS: ${{ secrets.EXPERT_EMAILS }}
        run: python -m AUTOMATION.send_reminder_if_needed

      - name: Clean up secret files
        if: always()
        run: rm -f stryktipset-priors-automation-27f390beda4d.json email_config.txt